name: PanaLink V2.0 OTA Distribution Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      changelog:
        description: 'Changelog description for this release'
        required: false
        default: 'PanaLink V2.0 Security and Performance OTA update.'
      is_mandatory:
        description: 'Is this a mandatory update?'
        required: false
        default: 'false'
      minimum_version:
        description: 'Minimum supported versionCode'
        required: false
        default: '1'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 1. Descarga e instala Gradle 9.3.1 (Consistency with android.yml)
      - name: Download and Install Gradle 9.3.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-9.3.1/bin" >> $GITHUB_PATH

      - name: Setup Android Build Tools
        run: |
          # Find the latest build-tools version
          BUILD_TOOLS_VERSION=$(ls $ANDROID_SDK_ROOT/build-tools | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_VERSION"
          echo "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION" >> $GITHUB_PATH

      - name: Prepare Secrets Configuration
        run: |
          touch secrets.properties
          touch secrets.defaults.properties
          touch app/secrets.properties
          touch app/secrets.defaults.properties

      - name: Inyectar Google Services JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            cat << 'EOF' > app/google-services.json
            ${{ secrets.GOOGLE_SERVICES_JSON }}
            EOF
          else
            echo "Warning: GOOGLE_SERVICES_JSON secret is missing."
          fi

      - name: Decode Keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing! Release signing will fail."
            exit 1
          fi
          cat << 'EOF' > base64_temp.txt
          ${{ secrets.KEYSTORE_BASE64 }}
          EOF
          base64 --decode --ignore-garbage base64_temp.txt > app/release-key.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Test Keystore Integrity & Fingerprint
        env:
          KEY_PASS_RAW: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_RAW: ${{ secrets.KEY_ALIAS }}
        run: |
          CLEAN_PASS=$(echo "$KEY_PASS_RAW" | xargs)
          CLEAN_ALIAS=$(echo "$KEY_ALIAS_RAW" | xargs)
          echo "=== VERIFICANDO KEYSTORE ==="
          keytool -list -v -keystore app/release-key.jks -alias "$CLEAN_ALIAS" -storepass "$CLEAN_PASS" | grep -E "Alias name|Owner|Issuer|SHA256" || { echo "❌ ERROR: Keystore inválido o contraseña incorrecta."; exit 1; }
          echo "✅ KEYSTORE VERIFICADO"

      - name: Run Unit Tests
        run: gradle testDebugUnitTest

      - name: Build Release APK
        env:
          KEY_ALIAS_RAW: ${{ secrets.KEY_ALIAS }}
          KEY_PASS_RAW: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS_PRIVATE_RAW: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          # Use Git Tag as Version Name if available, fallback to run number
          VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('1.0.{0}', github.run_number) }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export KEY_ALIAS=$(echo "$KEY_ALIAS_RAW" | xargs)
          export KEYSTORE_PASSWORD=$(echo "$KEY_PASS_RAW" | xargs)
          export KEY_PASSWORD=$(echo "$KEY_PASS_PRIVATE_RAW" | xargs)
          export KEYSTORE_FILE="release-key.jks"
          
          gradle assembleRelease

      - name: Audit, Package and Generate OTA Manifest
        id: package_ota
        run: |
          python3 -c '
          import os
          import subprocess
          import hashlib
          import json
          import re

          # Find the compiled release APK
          apk_candidates = []
          for root, dirs, files in os.walk("app/build/outputs/apk/release"):
              for file in files:
                  if file.endswith(".apk") and not file.endswith("-unsigned.apk"):
                      apk_candidates.append(os.path.join(root, file))

          if not apk_candidates:
              print("::error::No signed release APK found!")
              exit(1)

          apk_path = apk_candidates[0]
          print(f"Found compiled APK: {apk_path}")

          # Verify signature and package using apksigner
          try:
              output = subprocess.check_output(["apksigner", "verify", "--print-certs", "-v", apk_path], text=True)
              print("=== APK SIGNATURE VERIFICATION ===")
              for line in output.split("\n"):
                  if "SHA-256 digest" in line or "Signer" in line:
                      print(line)
              print("APK Signature verification: SUCCESS")
          except Exception as e:
              print(f"::error::APK signature verification failed: {e}")
              exit(1)

          # Extract badging info using aapt2
          try:
              badging = subprocess.check_output(["aapt2", "dump", "badging", apk_path], text=True)
          except Exception as e:
              print(f"::error::Failed to extract APK badging info: {e}")
              exit(1)

          # Validate Package Name
          package_match = re.search(r"package:\s+name='\''([^'\'']*)'\''", badging)
          if not package_match:
              print("::error::Could not read package name from APK!")
              exit(1)
          package_name = package_match.group(1)
          print(f"Detected Package Name: {package_name}")
          if package_name != "com.panalink.app":
              print(f"::error::Package name must be com.panalink.app! Found: {package_name}")
              exit(1)

          # Extract versionCode and versionName
          vc_match = re.search(r"versionCode='\''(\d+)'\''", badging)
          vn_match = re.search(r"versionName='\''([^'\'']*)'\''", badging)

          version_code = int(vc_match.group(1)) if vc_match else 1
          version_name = vn_match.group(1) if vn_match else "1.0.0"
          print(f"Detected Version Code: {version_code}")
          print(f"Detected Version Name: {version_name}")

          # Calculate SHA-256 Hash
          sha256_hash = hashlib.sha256()
          with open(apk_path, "rb") as f:
              for byte_block in iter(lambda: f.read(4096), b""):
                  sha256_hash.update(byte_block)
          sha256_val = sha256_hash.hexdigest()
          print(f"Calculated SHA-256: {sha256_val}")

          # Define the target APK file name
          target_apk_name = f"panalink-release-{version_name}.apk"
          target_apk_path = os.path.join(os.path.dirname(apk_path), target_apk_name)
          os.rename(apk_path, target_apk_path)
          print(f"Renamed APK to: {target_apk_path}")

          # Build manifest.json
          is_mandatory_str = "${{ github.event.inputs.is_mandatory }}" or "false"
          is_mandatory = is_mandatory_str.lower() == "true"
          min_version_str = "${{ github.event.inputs.minimum_version }}" or "1"
          try:
              min_version = int(min_version_str)
          except ValueError:
              min_version = 1

          changelog_input = """${{ github.event.inputs.changelog }}""" or f"PanaLink V2.0 OTA Release v{version_name}"
          changelog_list = [line.strip() for line in changelog_input.split("\n") if line.strip()]

          manifest_data = {
              "versionCode": version_code,
              "versionName": version_name,
              "downloadUrl": f"https://github.com/Andresaguiar22/panalink-ota/releases/download/v{version_name}/{target_apk_name}",
              "sha256": sha256_val,
              "mandatory": is_mandatory,
              "minimumSupportedVersionCode": min_version,
              "changelog": changelog_list
          }

          with open("manifest.json", "w") as f:
              json.dump(manifest_data, f, indent=2)
          print("Generated manifest.json:")
          print(json.dumps(manifest_data, indent=2))

          # Save outputs for next steps
          with open(os.environ["GITHUB_OUTPUT"], "a") as go:
              go.write(f"version_name=v{version_name}\n")
              go.write(f"apk_path={target_apk_path}\n")
              go.write(f"apk_name={target_apk_name}\n")
          '

      - name: Create and Publish Release in Andresaguiar22/panalink-ota
        run: |
          TAG_NAME="${{ steps.package_ota.outputs.version_name }}"
          APK_PATH="${{ steps.package_ota.outputs.apk_path }}"
          
          if [ -z "${{ secrets.OTA_GITHUB_TOKEN }}" ]; then
            echo "::error::OTA_GITHUB_TOKEN is missing! Cannot publish to panalink-ota."
            exit 1
          fi

          echo "=== PUBLISHING TO OTA REPOSITORY ==="
          
          # Check if tag already exists in panalink-ota
          if gh release view "$TAG_NAME" --repo "Andresaguiar22/panalink-ota" > /dev/null 2>&1; then
            echo "Release $TAG_NAME already exists! Updating assets..."
            gh release upload "$TAG_NAME" --repo "Andresaguiar22/panalink-ota" --clobber "$APK_PATH" manifest.json
          else
            echo "Creating new Release: $TAG_NAME"
            gh release create "$TAG_NAME" \
              --repo "Andresaguiar22/panalink-ota" \
              --title "PanaLink V2.0 OTA Release $TAG_NAME" \
              --notes "Automated OTA Release from production builder pipeline" \
              --target "main" \
              "$APK_PATH" manifest.json
          fi
        env:
          GH_TOKEN: ${{ secrets.OTA_GITHUB_TOKEN }}

      - name: Clean up Keystore
        if: always()
        run: rm -f app/release-key.jks
