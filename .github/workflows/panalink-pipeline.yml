name: PanaLink V2.0 Unified Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      changelog:
        description: 'Changelog description (OTA only)'
        required: false
        default: 'PanaLink V2.0 Security and Performance update.'
      is_mandatory:
        description: 'Is this a mandatory update? (OTA only)'
        required: false
        default: 'false'
      minimum_version:
        description: 'Minimum supported versionCode (OTA only)'
        required: false
        default: '1'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Download and Install Gradle 9.3.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-9.3.1/bin" >> $GITHUB_PATH

      - name: Setup Android Build Tools
        run: |
          BUILD_TOOLS_VERSION=$(ls $ANDROID_SDK_ROOT/build-tools | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_VERSION"
          echo "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION" >> $GITHUB_PATH

      - name: Prepare Secrets Configuration
        run: |
          touch secrets.properties
          touch secrets.defaults.properties
          touch app/secrets.properties
          touch app/secrets.defaults.properties

      - name: Inyectar Google Services JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json inyectado correctamente."
          else
            echo "::error::GOOGLE_SERVICES_JSON secret is missing!"
            exit 1
          fi

      - name: Decode Keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing! Build will likely fail."
            exit 1
          fi
          cat << 'EOF' > base64_temp.txt
          ${{ secrets.KEYSTORE_BASE64 }}
          EOF
          base64 --decode --ignore-garbage base64_temp.txt > app/release-key.jks
          cp app/release-key.jks release-key.jks

      - name: Test Keystore Integrity & Fingerprint
        run: |
          keytool -list -v -keystore app/release-key.jks --storepass "${{ secrets.KEYSTORE_PASSWORD }}" || true
          echo "¡BOVEDA ABIERTA CON ÉXITO!"

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Clean up Keystore
        if: always()
        run: rm -f app/release-key.jks release-key.jks base64_temp.txt
